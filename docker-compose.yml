name: mintmark

services:
  postgres:
    image: postgres:18-alpine
    container_name: mintmark-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mintmark
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mintmark"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - mintmark_pgdata:/var/lib/postgresql/data

volumes:
  mintmark_pgdata:
